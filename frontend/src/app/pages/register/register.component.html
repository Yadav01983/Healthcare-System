<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  
</head>
<body>
  
  <div class="login-container">
    <div class="login-card">
      <h2>Register</h2>

      <input type="text" [(ngModel)]="name" placeholder="Name"><br><br>
      <input type="email" [(ngModel)]="email" placeholder="Email"><br><br>
      <input type="password" [(ngModel)]="password" placeholder="Password"><br><br>
      <input type="text" [(ngModel)]="phone" placeholder="Phone"><br><br>

      <button (click)="register()">Register</button>

      <br><br>
      <a routerLink="/">Go to Login</a>
    </div>
  </div>
</body>
</html>
