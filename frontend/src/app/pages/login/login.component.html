<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <h2>Login</h2>

      <input type="email" [(ngModel)]="email" placeholder="Email"><br><br>
      <input type="password" [(ngModel)]="password" placeholder="Password"><br><br>

      <button (click)="login()">Login</button>

      <br><br>
      <a routerLink="/register">Go to Register</a>
    </div>
  </div>
</body>
</html>
